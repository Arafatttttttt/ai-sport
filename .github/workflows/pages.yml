name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout built site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Remove git metadata
        run: rm -rf site/.git
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
